[project]
name = "dairymanagement"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yadavsunnykumar", email = "sunnykumary029@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dairymanagement = "dairymanagement:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
